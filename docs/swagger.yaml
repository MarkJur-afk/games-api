openapi: 3.0.2
info:
  title: Games API
  version: 1.0.0
  description: Games API documentation
paths:
  /games:
    get:
      tags:
        - games
      summary: Get a list of all games
      description: Returns a list of all games in API.
      responses:
        '200':
          description: Returns a list of games.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Game'
components:
  schemas:
    Game:
      type: object
      required:
        - id
        - name
        - price
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Witcher 3
        price:
          type: number
          format: float
          example: 29.99
