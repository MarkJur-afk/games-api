openapi: 3.0.2
info:
  title: Games API
  version: 1.0.0
  description: Games API documentation
paths:
  /games:
    get:
      tags:
        - games
      summary: Get a list of all games
      description: Returns a list of all games in API.
      responses:
        '200':
          description: Returns a list of games.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Game'
    post:
      tags:
        - new-game
      summary: Creates a game
      description: Creates a new game.
      requestBody:
        required: true
        description: A new game to be created.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewGame'
      responses:
        '201':
          description: Game created successfully.
          headers:
            Location:
              schema:
                type: string
              description: URL of the newly created game.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Game'
        '400':
          description: One or more required parameters are missing or invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: A game with this title already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /games/{id}:
    get:
      tags:
        - games
      summary: Get full details of a game
      description: Returns full details of a given game by ID.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Full details of a given game.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Game'
        '400':
          description: Invalid ID format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Game was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    Game:
      type: object
      required:
        - id
        - name
        - price
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Witcher 3
        price:
          type: number
          format: float
          example: 29.99
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: string
    NewGame:
      type: object
      required:
        - name
        - price
      properties:
        name:
          type: string
          example: Tetris
        price:
          type: number
          format: float
          example: 0.99
